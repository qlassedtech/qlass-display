name: Deploy to display.qlass.in

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-display
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH || '~/qlass-display' }}"
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --all --prune
            git reset --hard origin/main
            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env is missing. Create it from .env.example (ADMIN_PASSWORD, SESSION_SECRET)." >&2
              exit 1
            fi
            mkdir -p data/uploads
            docker compose up -d --build --remove-orphans
            docker image prune -f >/dev/null
            sleep 5
            curl -fsS http://localhost:${PORT:-3000}/healthz || docker compose logs --tail=50
