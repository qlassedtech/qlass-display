name: Deploy to display.qlass.in

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-display
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          # This host runs the app under PM2 behind the box's existing nginx (shared with several
          # other qlass.in sites) rather than Docker+Caddy — Caddy grabbing 80/443 here would break
          # every other site on the server. If you move to a dedicated box, switch this back to the
          # docker compose approach instead.
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_PATH || '~/qlass-display' }}"
            cd "$APP_DIR"
            if [ ! -d .git ]; then
              git init -b main
              git remote add origin https://github.com/${{ github.repository }}.git
            fi
            git fetch --all --prune
            git reset --hard origin/main
            # No `git clean` here on purpose: this directory has host-specific operational files
            # (ecosystem.config.cjs, backup/SSL scripts, etc.) that aren't in the repo and must survive.
            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env is missing. Create it from .env.example." >&2
              exit 1
            fi
            mkdir -p data/uploads
            npm ci --omit=dev
            pm2 restart qlass-display --update-env
            sleep 3
            curl -fsS http://localhost:3200/healthz || pm2 logs qlass-display --lines 50 --nostream
