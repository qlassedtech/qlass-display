  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"8c22d246-62f1-4ee8-97cf-771dd54cd1dd\"><\u002Fscript>\n<script src=\"4a5e75a2-c4b6-4fae-9885-5d29354ca7fd\"><\u002Fscript>\n\n<style>\nhtml,body{margin:0;padding:0;background:#F4F5FB;}\n*{box-sizing:border-box;}\na{color:#1717C1;}\na:hover{color:#0D0B6E;}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;font-family:'Manrope',system-ui,sans-serif;color:#0D0B6E;display:flex;flex-direction:column;\">\n  <header style=\"background:#fff;border-bottom:1px solid #E1E3F0;padding:14px 28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;\">\n    <div style=\"display:flex;align-items:center;gap:16px;\">\n      <img src=\"2c640ed6-dd17-44d6-838f-32eb1999f35c\" alt=\"Qlass Learning\" style=\"height:34px;width:auto;display:block;\">\n      <div style=\"width:1px;height:28px;background:#E1E3F0;\"><\u002Fdiv>\n      <div style=\"font-weight:800;font-size:17px;\">Social studio<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n      <a href=\"{{ portalHref }}\" style=\"height:38px;display:flex;align-items:center;padding:0 14px;border-radius:10px;border:1px solid #D6D9EA;background:#fff;color:#0D0B6E;font-weight:700;font-size:14px;text-decoration:none;\">Display portal<\u002Fa>\n      <a href=\"{{ tvHref }}\" target=\"_blank\" style=\"height:38px;display:flex;align-items:center;padding:0 14px;border-radius:10px;background:#0D0B6E;color:#fff;font-weight:700;font-size:14px;text-decoration:none;\">Open TV view ↗<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"width:100%;max-width:1360px;margin:0 auto;padding:24px 28px;display:flex;flex-direction:column;gap:18px;\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;\">\n      <div style=\"display:flex;flex-direction:column;gap:4px;\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:34px;line-height:1.1;\">Posts &amp; reels for Instagram<\u002Fdiv>\n        <div style=\"font-size:14px;color:{{ statusColor }};\">{{ statusText }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;\">\n        <div style=\"display:flex;background:#E6E8F4;border-radius:12px;padding:4px;gap:4px;\">\n          <sc-for list=\"{{ modes }}\" as=\"t\" hint-placeholder-count=\"2\">\n            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:none;border-radius:9px;padding:9px 16px;font:700 14px 'Manrope',sans-serif;cursor:pointer;background:{{ t.bg }};color:{{ t.fg }};box-shadow:{{ t.shadow }};\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isPost }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-wrap:wrap;background:#E6E8F4;border-radius:12px;padding:4px;gap:4px;\">\n            <sc-for list=\"{{ formats }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"border:none;border-radius:9px;padding:9px 14px;font:700 14px 'Manrope',sans-serif;cursor:pointer;background:{{ t.bg }};color:{{ t.fg }};box-shadow:{{ t.shadow }};\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start;\">\n      <aside style=\"flex:1 1 250px;max-width:100%;background:#fff;border:1px solid #E1E3F0;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;max-height:720px;overflow:auto;\">\n        <div style=\"padding:10px 12px 4px;display:flex;flex-direction:column;gap:8px;\">\n          <sc-raw-select value=\"{{ testValue }}\" sc-camel-on-change=\"{{ onTest }}\" style=\"height:38px;border:1px solid #D6D9EA;border-radius:10px;padding:0 10px;font:700 14px 'Manrope',sans-serif;color:#0D0B6E;background:#fff;\">\n            <sc-for list=\"{{ tests }}\" as=\"t\" hint-placeholder-count=\"2\"><option value=\"{{ t.value }}\">{{ t.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <sc-raw-select value=\"{{ clsValue }}\" sc-camel-on-change=\"{{ onCls }}\" style=\"height:38px;border:1px solid #D6D9EA;border-radius:10px;padding:0 10px;font:700 14px 'Manrope',sans-serif;color:#0D0B6E;background:#fff;\">\n            <sc-for list=\"{{ classes }}\" as=\"c\" hint-placeholder-count=\"3\"><option value=\"{{ c.value }}\">{{ c.label }}<\u002Foption><\u002Fsc-for>\n          <\u002Fsc-raw-select>\n          <div style=\"font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#7A7FB0;\">{{ listTitle }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ items }}\" as=\"it\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ it.onClick }}\" style=\"text-align:left;border:none;border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:12px;background:{{ it.bg }};color:{{ it.fg }};font-family:'Manrope',sans-serif;\">\n            <span style=\"width:38px;height:38px;flex:none;border-radius:50%;background:{{ it.dotBg }};color:{{ it.dotFg }};display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:16px;\">{{ it.badge }}<\u002Fspan>\n            <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;\">\n              <span style=\"font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ it.name }}<\u002Fspan>\n              <span style=\"font-size:12px;opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ it.meta }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-weight:800;font-size:13px;\">{{ it.pct }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Faside>\n\n      <section style=\"flex:3 1 420px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px;background:#E9EBF5;border-radius:16px;padding:24px;\">\n        <canvas ref=\"{{ canvasRef }}\" style=\"display:block;width:100%;max-width:{{ previewW }}px;height:auto;box-shadow:0 18px 50px rgba(13,11,110,.25);background:#0D0B6E;\"><\u002Fcanvas>\n        <sc-if value=\"{{ isReel }}\">\n          <div style=\"display:flex;align-items:center;gap:12px;width:100%;max-width:{{ previewW }}px;\">\n            <button sc-camel-on-click=\"{{ togglePlay }}\" style=\"height:36px;padding:0 14px;border-radius:10px;border:1px solid #C9CDE6;background:#fff;color:#0D0B6E;font:700 13px 'Manrope',sans-serif;cursor:pointer;\">{{ playLabel }}<\u002Fbutton>\n            <div style=\"flex:1;height:4px;background:#C9CDE6;border-radius:2px;overflow:hidden;\"><div ref=\"{{ scrubRef }}\" style=\"height:100%;width:0%;background:#1717C1;\"><\u002Fdiv><\u002Fdiv>\n            <span style=\"font-size:13px;font-weight:700;color:#5A5F8F;\">15s<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;max-width:{{ previewW }}px;\">\n            <span style=\"font-size:13px;font-weight:800;color:#0D0B6E;\">Music<\u002Fspan>\n            <sc-for list=\"{{ moods }}\" as=\"m\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"height:32px;padding:0 12px;border-radius:999px;border:1px solid {{ m.border }};background:{{ m.bg }};color:{{ m.fg }};font:700 12px 'Manrope',sans-serif;cursor:pointer;\">{{ m.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;max-width:{{ previewW }}px;\">\n            <button sc-camel-on-click=\"{{ pickSong }}\" style=\"height:32px;padding:0 12px;border-radius:999px;border:1px dashed #1717C1;background:#fff;color:#1717C1;font:700 12px 'Manrope',sans-serif;cursor:pointer;\">{{ songBtn }}<\u002Fbutton>\n            <input type=\"file\" accept=\"audio/*\" ref=\"{{ songRef }}\" sc-camel-on-change=\"{{ onSong }}\" style=\"display:none;\">\n            <sc-if value=\"{{ hasSong }}\">\n              <span style=\"font-size:12px;color:#5A5F8F;\">Starts at<\u002Fspan>\n              <input type=\"range\" min=\"0\" max=\"{{ songMax }}\" step=\"1\" value=\"{{ songStart }}\" sc-camel-on-change=\"{{ onSongStart }}\" style=\"flex:1;min-width:120px;accent-color:#1717C1;\">\n              <span style=\"font-size:12px;font-weight:700;color:#0D0B6E;\">{{ songStartText }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:#5A5F8F;width:100%;max-width:{{ previewW }}px;line-height:1.45;text-wrap:pretty;\">Only upload songs you have the rights to. For trending film songs, choose “Off” and add the song inside Instagram — it’s licensed there.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <aside style=\"flex:1 1 300px;max-width:100%;display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"background:#fff;border:1px solid #E1E3F0;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font-weight:800;font-size:14px;\">Background photo<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;\">\n            <sc-for list=\"{{ bgs }}\" as=\"b\" hint-placeholder-count=\"6\">\n              <button sc-camel-on-click=\"{{ b.onClick }}\" title=\"{{ b.label }}\" style=\"aspect-ratio:4/3;border-radius:10px;border:3px solid {{ b.border }};background:#0D0B6E center/cover no-repeat;background-image:{{ b.thumbCss }};cursor:pointer;padding:0;display:flex;align-items:flex-end;justify-content:flex-start;\">\n                <span style=\"margin:4px;background:rgba(13,11,110,.8);color:#fff;font:700 11px 'Manrope',sans-serif;padding:2px 6px;border-radius:6px;\">{{ b.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fd u002Fdiv>\n          <textarea value=\"{{ caption }}\" sc-camel-on-change=\"{{ onCaption }}\" rows=\"10\" style=\"width:100%;border:1px solid #D6D9EA;border-radius:10px;padding:12px;font:500 14px/1.5 'Manrope',sans-serif;color:#0D0B6E;resize:vertical;outline:none;\"><\u002Ftextarea>\n          <button sc-camel-on-click=\"{{ regenCaption }}\" style=\"align-self:flex-start;border:none;background:transparent;padding:0;color:#1717C1;font:700 13px 'Manrope',sans-serif;cursor:pointer;\">Write another version<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;minPercent&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:5,&quot;unit&quot;:&quot;%&quot;,&quot;default&quot;:80,&quot;tsType&quot;:&quot;number&quot;},&quot;photoUrlPattern&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sheetUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://docs.google.com/spreadsheets/d/1uPrXEi93HPhphqgdwRY2HcJxD7WgDQFOaXGVeZCpR-0/edit?gid=1634670191#gid=1634670191&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nconst SHEET = 'https://docs.google.com/spreadsheets/d/1uPrXEi93HPhphqgdwRY2HcJxD7WgDQFOaXGVeZCpR-0/edit?gid=1634670191#gid=1634670191';\nconst num = (s) => { const n = parseFloat(String(s).replace(/[^0-9.\\-]/g, '')); return isNaN(n) ? null : n; };\nconst fmt = (n) => Number.isInteger(n) ? String(n) : String(+n.toFixed(2));\nfunction parseCSV(t) {\n  const rows = []; let row = [], f = '', q = false;\n  for (let i = 0; i < t.length; i++) { const c = t[i];\n    if (q) { if (c === '\"') { if (t[i + 1] === '\"') { f += '\"'; i++; } else q = false; } else f += c; }\n    else if (c === '\"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\\n') { row.push(f); rows.push(row); row = []; f = ''; } else if (c !== '\\r') f += c; }\n  if (f || row.length) { row.push(f); rows.push(row); } return rows;\n}\nconst COLS = { id: [/qlassid/, /^id$/], name: [/^name$/, /studentname/], cls: [/^class/], school: [/school/], subject: [/subject/], exam: [/testname/, /^exam$/], marks: [/obtained/, /^marks$/], total: [/fullmarks/, /total/], pct: [/percent/], photo: [/photo/], date: [/testdate/, /^date$/] };\nconst tag = (s) => '#' + String(s || '').replace(/[^A-Za-z0-9]/g, '');\nconst BGS = [{ src: 'assets/photos/classroom.jpg', label: 'Classroom' }, { src: 'assets/photos/uniform.jpg', label: 'Students' }, { src: 'assets/photos/desks.jpg', label: 'Desks' }, { src: 'assets/photos/newspaper.jpg', label: 'Reading' }, { src: 'assets/photos/boy.jpg', label: 'Student' }, { src: '', label: 'Plain' }];\nconst CTA = (c) => `\\n\\n🎯 Want results like this for your child?\\nAdmissions are open — book a FREE demo class today!\\n📞 ${c[1] || ''}  🌐 ${c[0] || ''}`;\nconst CAPS = [\n  (s, c) => `🏆 TOPPER ALERT! ${s.pct}%${s.subject && !s.subject.startsWith('Overall') ? ` in ${s.subject}` : ' overall'}!\\n\\nHuge congratulations to ${s.name} ${s.cls ? `(${s.cls}, ${s.school})` : `from ${s.school}`} on scoring ${s.pct}%${s.exam ? ` in the ${s.exam}` : ''}${s.marks && s.total ? ` — ${s.marks} out of ${s.total}` : ''}. 🎉${s.best && s.best.includes('·') ? `\\n\\nBest subjects: ${s.best}` : ''}`,\n  (s, c) => `Another proud moment at Qlass Learning! ${s.first} from ${s.cls || 'our class'}, ${s.school}, scored ${s.pct}% ${s.inSubj}${s.exam ? ` in the ${s.exam}` : ''}.\\n\\nKeep shining, ${s.first}! ✨`,\n  (s, c) => `Hard work pays off. ${s.name} scored ${s.marks && s.total ? `${s.marks}/${s.total} ` : ''}(${s.pct}%) ${s.inSubj}${s.exam ? ` in the ${s.exam}` : ''}.\\n\\nCongratulations from the entire Qlass Learning family!`,\n];\nconst RECAPS = [\n  (l, min) => `Meet our achievers! 🏆 These students scored ${min}% and above:\\n\\n${l.map(s => `• ${s.name} (${s.cls || s.school}) — ${s.pct}% ${s.inSubj}`).join('\\n')}\\n\\nProud of every one of you!`,\n  (l, min) => `${l.length} students, one goal: excellence. Congratulations to everyone who scored ${min}%+ this time:\\n\\n${l.map(s => `${s.name} · ${s.pct}%`).join('\\n')}`,\n];\n\nclass Component extends DCLogic {\n  state = { songName: '', songStart: 0, songDur: 0, music: 'auto', cls: '', test: null, bg: 0, mode: 'post', format: 'portrait', students: [], sel: 'recap', status: 'Loading results…', ok: true, playing: true, caption: null, capV: 0, copied: false, busy: false, progress: 0, busyText: '' };\n  canvasRef = React.createRef(); scrubRef = React.createRef(); songRef = React.createRef();\n  logo = null; photos = {};\n\n  async componentDidMount() {\n    await window.QlassArt.ready();\n    this.logo = await window.QlassArt.loadImage('assets/qlass-logo-white.png');\n    this.bgImgs = await Promise.all(BGS.map(b => window.QlassArt.loadImage(b.src)));\n    this.draw();\n    this.load();\n  }\n  componentWillUnmount() { cancelAnimationFrame(this.raf); this.stopMusic(); }\n  componentDidUpdate() {\n    const s = this.state, k = [s.cls, s.test, s.bg, s.mode, s.format, s.sel, s.students.length, s.playing, this.props.minPercent].join('|');\n    if (k === this.lastK) return;\n    const prev = (this.lastK || '').split('|');\n    this.lastK = k;\n    if (prev[5] !== String(s.sel) || prev[3] !== s.mode) { this.reelT0 = performance.now(); this.pausedAt = 0; this.musicLoop = null; this.stopMusic(); if (s.caption !== null && prev[5] !== String(s.sel)) this.setState({ caption: null }); }\n    this.draw();\n  }\n  artOpts() { return { logo: this.logo, contact: this.contact(), minPct: this.minPct(), bgPhoto: this.bgImgs ? this.bgImgs[this.state.bg] : null, cta: this.props.cta }; }\n  contact() { return this.apiContact ?? this.props.contactLine ?? 'qlasslearning.com · +91 90310 03985'; }\n  minPct() { return Number(this.apiMin ?? this.props.minPercent ?? 80); }\n  testList() { return window.QlassArt ? window.QlassArt.tests(this.state.students) : []; }\n  curTest() { const t = this.testList(); return this.state.test && t.includes(this.state.test) ? this.state.test : t[0]; }\n  classList() { const t = this.curTest(); return [...new Set(this.state.students.filter(s => s.exam === t).map(s => s.cls).filter(Boolean))].sort((a, b) => (parseInt(a.replace(/\\D/g, '')) || 0) - (parseInt(b.replace(/\\D/g, '')) || 0)); }\n  achievers() { const t = this.curTest(), c = this.state.cls; return this.state.students.filter(s => s.exam === t && (!c || s.cls === c) && s.pct >= this.minPct()).sort((a, b) => b.pct - a.pct); }\n  current() { return this.state.sel === 'recap' ? null : this.achievers().find(a => a.key === this.state.sel) || null; }\n\n  async loadFromServer() {\n    try {\n      const r = await fetch('/api/achievers', { cache: 'no-store' });\n      if (r.status === 401) { location.href = '/admin'; return true; }\n      if (!r.ok || !(r.headers.get('content-type') || '').includes('json')) return false;\n      const j = await r.json();\n      this.apiMin = j.settings.minPercent; this.apiContact = j.contact;\n      const students = j.students.filter(s => !s.hidden).map(s => ({ ...s, photo: null }));\n      this.setState({ students, status: j.error || `${students.filter(s => s.pct >= this.minPct()).length} achievers at ${this.minPct()}%+ from the results sheet`, ok: !j.error });\n      students.forEach(async st => { if (!st.photoUrl) return; const im = await window.QlassArt.loadImage(st.photoUrl); if (im) { st.photo = im; this.draw(); } });\n      return true;\n    } catch (e) { return false; }\n  }\n  async load() {\n    if (await this.loadFromServer()) return;\n    const id = (SHEET.match(/\\/d\\/([\\w-]+)/) || [])[1], u = this.props.sheetUrl || SHEET, sid = (u.match(/\\/d\\/([\\w-]+)/) || [])[1] || id, gid = (u.match(/gid=(\\d+)/) || [])[1];\n    try {\n      const r = await fetch(`https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:csv&headers=1${gid ? '&gid=' + gid : ''}`);\n      const t = await r.text(); if (!r.ok || /^\\s*<\u002F.test(t)) throw 0;\n      const arr = parseCSV(t), head = arr[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ''));\n      const ix = {}; for (const k in COLS) ix[k] = head.findIndex(h => COLS[k].some(re => re.test(h)));\n      const g = (r, k) => ix[k] >= 0 ? String(r[ix[k]] || '').trim() : '';\n      const pat = this.props.photoUrlPattern || '';\n      const rows = arr.slice(1).filter(r => g(r, 'name')).map((r, i) => {\n        const m = num(g(r, 'marks')), tt = num(g(r, 'total')); let p = num(g(r, 'pct')); if (p == null && m != null && tt) p = m / tt * 100;\n        const name = g(r, 'name').replace(/\\s+/g, ' '), parts = name.split(' ');\n        let cls = g(r, 'cls'); if (/^\\d+$/.test(cls)) cls = 'Class ' + cls;\n        const pu = /^https?:/.test(g(r, 'photo')) ? g(r, 'photo') : (pat && g(r, 'id') ? pat.replace('{id}', encodeURIComponent(g(r, 'id'))) : '');\n        return { key: i + '|' + name + '|' + g(r, 'exam'), id: g(r, 'id'), name, first: parts[0], initials: (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase(),\n          cls, school: g(r, 'school'), subject: g(r, 'subject'), exam: g(r, 'exam'), date: g(r, 'date'), marks: m != null ? fmt(m) : '', total: tt != null ? fmt(tt) : '', pct: Math.round(p || 0), photoUrl: pu, photo: null };\n      });\n      const students = window.QlassArt.group(rows);\n      this.setState({ students, status: `${rows.length} result rows · ${students.length} student-tests`, ok: true });\n      students.forEach(async st => { if (!st.photoUrl) return; const im = await window.QlassArt.loadImage(st.photoUrl); if (im) { st.photo = im; this.draw(); } });\n    } catch (e) { this.setState({ status: 'Couldn’t read the results sheet — check it’s shared “Anyone with the link”.', ok: false }); }\n  }\n\n  draw() {\n    const cv = this.canvasRef.current; if (!cv || !window.QlassArt) return;\n    cancelAnimationFrame(this.raf);\n    const Q = window.QlassAr
