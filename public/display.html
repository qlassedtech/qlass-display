<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qlass Display</title>
<!-- Lets Chrome's "Add to Home Screen" launch this as a standalone (no address bar) app — the
     practical way to hide the browser chrome on a TV box that's locked to plain Chrome with no
     kiosk-app install available. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Manrope:wght@500;600;700;800&display=swap">
<!-- Written in plain ES5 (var/function, no arrow/template-literal/let/const) on purpose: this is the
     diagnostic net for TV browsers whose JS engine is too old to run the rest of the page, so it must
     parse and run even when everything after it can't. A single scrollable on-screen log — both
     successes and failures, not just errors — so a photo of the TV is always enough to debug from,
     since these TVs can't be remotely inspected otherwise. -->
<script>
(function () {
  // Now that every entry also ships to the server (see queueForServer/flushToServer below), the
  // on-screen panel isn't needed for debugging day to day — read GET /api/client-log instead. Left
  // as an opt-in (?debug=1 in the URL) rather than removed outright: partly to rule out, on this
  // specific already-unstable device, whether an extra always-on fixed-position overlay stresses an
  // already-degraded GPU compositor enough to affect other layers; partly because it's still handy
  // to have on demand without a redeploy. Off by default so normal playback never pays for it.
  var SHOW_ON_SCREEN = /[?&]debug=1(?:&|$)/.test(location.search);
  var panel = null, list = null;
  var COLORS = { ok: "#6f6", info: "#ccc", warn: "#fd5", error: "#f66" };
  var MAX_LINES = 50; // caps DOM growth over a day of uptime; oldest entries drop off the top
  function ensurePanel() {
    if (panel) return panel;
    panel = document.createElement("div");
    panel.id = "qlog";
    panel.style.cssText = "position:fixed;left:0;top:0;right:0;max-height:45%;overflow:auto;" +
      "background:rgba(0,0,0,.6);font:12px/1.4 monospace;padding:4px 8px;z-index:999998;white-space:pre-wrap;";
    list = document.createElement("div");
    panel.appendChild(list);
    (document.body || document.documentElement).appendChild(panel);
    return panel;
  }
  // level: "ok" (succeeded), "info" (in progress / neutral), "warn" (recovered from a problem),
  // "error" (failed outright). Every call appends a new timestamped line — nothing overwrites, so the
  // full recent history is visible in one screenshot (when SHOW_ON_SCREEN is on), not just the latest
  // moment; otherwise it's still captured via queueForServer below regardless.
  function log(level, label, detail) {
    if (SHOW_ON_SCREEN) {
      try {
        ensurePanel();
        var line = document.createElement("div");
        line.style.color = COLORS[level] || COLORS.info;
        line.textContent = "[" + new Date().toISOString().slice(11, 19) + "] " + label + (detail ? ": " + detail : "");
        list.appendChild(line);
        while (list.children.length > MAX_LINES) list.removeChild(list.firstChild);
        panel.scrollTop = panel.scrollHeight;
      } catch (e) { /* even the fallback failed; nothing more we can do */ }
    }
    queueForServer(level, label, detail);
  }

  // Ships every log line to the server too, so debugging this TV never needs another photo — read
  // it back any time via GET /api/client-log instead. Batched and sent periodically (not one request
  // per line) to stay light on an unattended, possibly flaky TV connection; failed batches are kept
  // and retried rather than dropped, capped so a long outage can't grow this without bound.
  var sessionId = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  var pending = [];
  var MAX_PENDING = 300;
  function queueForServer(level, label, detail) {
    pending.push({ t: Date.now(), level: level, label: label, detail: detail || "" });
    if (pending.length > MAX_PENDING) pending.splice(0, pending.length - MAX_PENDING);
  }
  function flushToServer() {
    if (!pending.length || typeof fetch !== "function") return;
    var batch = pending;
    pending = [];
    // fetch() itself is wrapped in try/catch, not just its returned promise — on some old/broken
    // fetch implementations an unrecognized or unsupported options-object member (keepalive was
    // dropped for exactly this reason) can make the call throw synchronously instead of rejecting,
    // which .catch() alone would never see.
    try {
      fetch("/api/client-log", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session: sessionId, entries: batch }),
      }).then(function (r) {
        if (!r.ok) pending = batch.concat(pending); // server rejected it; retry next tick
      }, function () {
        // Put it back (ahead of anything logged since) rather than lose it; still capped above.
        pending = batch.concat(pending);
      });
    } catch (e) {
      pending = batch.concat(pending);
    }
  }
  setInterval(flushToServer, 5000);
  window.addEventListener("pagehide", flushToServer);
  window.addEventListener("error", function (e) {
    var msg = (e && e.message) || "unknown error";
    var where = e && e.filename ? (e.filename.split("/").pop() + ":" + e.lineno) : "";
    log("error", "JS error", msg + (where ? " (" + where + ")" : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e && e.reason ? (e.reason.message || String(e.reason)) : "unknown";
    log("error", "Unhandled promise rejection", reason);
  });
  window.addEventListener("DOMContentLoaded", function () {
    if (typeof window.QlassArt === "undefined") log("error", "achiever-art.js did not load/run (QlassArt is undefined)");
    else log("ok", "achiever-art.js loaded");
    if (typeof window.fetch !== "function") log("error", "fetch() is not supported on this browser");
  });
  // Logged once per session so the log history says which screen each session came from — otherwise
  // a TV session and a phone session opened to check on it are indistinguishable in the same stream.
  function describeDevice() {
    var ua = navigator.userAgent || "";
    var kind = "desktop/laptop";
    if (/\bTV\b|SmartTV|Tizen|Web0S|webOS|NetCast|HbbTV|BRAVIA|AFT[A-Z]|GoogleTV|Android TV|CrKey/i.test(ua)) kind = "TV";
    else if (/iPad|Tablet|Silk|(Android(?!.*Mobile))/i.test(ua)) kind = "tablet";
    else if (/Mobi|iPhone|iPod|Android.*Mobile|Windows Phone/i.test(ua)) kind = "mobile";
    var os = "unknown OS";
    if (/Tizen/i.test(ua)) os = "Tizen (Samsung)";
    else if (/Web0S|webOS/i.test(ua)) os = "webOS (LG)";
    else if (/Android/i.test(ua)) os = "Android";
    else if (/iPhone|iPad|iPod/i.test(ua)) os = "iOS";
    else if (/Mac OS X/i.test(ua)) os = "macOS";
    else if (/Windows/i.test(ua)) os = "Windows";
    else if (/Linux/i.test(ua)) os = "Linux";
    var m = /(?:Chrome|CriOS)\/(\d+)/.exec(ua) || /Version\/(\d+).*Safari/.exec(ua) || /Firefox\/(\d+)/.exec(ua);
    var browser = (/Firefox/i.test(ua) ? "Firefox" : (/Chrome|CriOS/i.test(ua) ? "Chrome" : (/Safari/i.test(ua) ? "Safari" : "other")));
    if (m) browser += " " + m[1];
    var screenSize = (window.screen ? window.screen.width + "x" + window.screen.height : "?");
    var viewport = window.innerWidth + "x" + window.innerHeight;
    var touch = ("ontouchstart" in window || (navigator.maxTouchPoints || 0) > 0) ? "touch" : "no-touch";
    return kind + " | " + os + " | " + browser + " | screen " + screenSize + " @" + (window.devicePixelRatio || 1) + "x | viewport " + viewport + " | " + touch + " | " + ua;
  }
  try { log("info", "DEVICE", describeDevice()); } catch (e) { log("warn", "DEVICE detect failed", (e && e.message) || ""); }

  window.__qlassLog = log;
  window.__qlassDiagReport = function (label, detail) { log("error", label, detail); }; // back-compat alias
  window.__qlassStatus = function (text) { log("info", text); };                        // back-compat alias

  // Dead-man's switch, independent of the main script below. The watchdog that lives in the main
  // script can only rescue a hang that happens *after* that script starts running — it does nothing
  // for a parse-time SyntaxError (like today's: the whole inline script block fails as a unit, so
  // nothing in it, including its own watchdog, ever executes). This one lives here instead, in the
  // same always-parses ES5 block as the log panel, so it survives exactly the failure mode that
  // matters most. The main script calls window.__qlassAlive() to prove it's actually running and
  // defer this; if that call stops arriving — whether the script never started, or started and then
  // hung — this fires on its own and reloads.
  var aliveTimer = null;
  function armDeadMansSwitch(ms) {
    clearTimeout(aliveTimer);
    aliveTimer = setTimeout(function () {
      log("error", "Dead-man's switch: no sign of life from the main script in " + (ms / 1000) + "s, reloading");
      location.reload();
    }, ms);
  }
  window.__qlassAlive = function () { armDeadMansSwitch(150000); }; // 2.5 min — generous vs. the main watchdog's own 2 min
  armDeadMansSwitch(60000); // first check is tighter: the main script should call __qlassAlive() within 60s of boot
})();
</script>
<!-- Some TV browsers (still showing their address bar, or with buggy vh/vw support) size 100vh/100vw
     against the wrong box, cutting off the bottom of the canvas slides. Measure the real viewport in
     JS instead and expose it as --vw/--vh so the canvas sizing rule below uses the actual visible
     area. Also plain ES5 so it runs even if nothing else can parse. -->
<script>
(function () {
  function setViewportVars() {
    var root = document.documentElement;
    root.style.setProperty("--vw", (window.innerWidth / 100) + "px");
    root.style.setProperty("--vh", (window.innerHeight / 100) + "px");
  }
  setViewportVars();
  window.addEventListener("resize", setViewportVars);
  window.addEventListener("orientationchange", setViewportVars);
})();
</script>
<script src="/achiever-art.js" onerror="window.__qlassDiagReport && window.__qlassDiagReport('Failed to load /achiever-art.js (network/script error)')"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .stage { position: fixed; inset: 0; background: #000; }
  .layer { position: absolute; inset: 0; opacity: 0; transition: opacity .8s ease; }
  .layer.show { opacity: 1; }
  .layer.instant { transition: none; }
  .layer img, .layer video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  /* REVERTED: forcing a 3D compositing layer (translateZ(0)/will-change) on a hardware-decoded <video>
     is the textbook way to get a solid-black video on Android WebView — the hardware overlay surface
     can't participate in a 3D-transformed layer, so it paints nothing and the element's own black
     background shows through instead. Confirmed on-device: the status log showed "SHOWING" (the layer
     genuinely became visible) while the video itself was solid black — consistent with this exact bug,
     not a visibility/compositing problem, so the "fix" was actively counterproductive. Left un-promoted. */
  /* Was a vw/vh-based 16:9 letterbox computed against this TV's viewport — left an unexplained black
     gap on one side only (not the symmetric pillarboxing a real aspect mismatch would produce), which
     points at this browser's viewport-unit math being unreliable rather than a genuine aspect-ratio
     difference. img/video already just fill 100%/100% of .layer (which is itself pinned full-bleed via
     position:fixed/inset:0 — plain percentages against that are NOT subject to the same mobile/TV
     "visual vs layout viewport" confusion that vw/vh units are) and render correctly, so canvas now
     matches that same simple approach instead of its own unit-dependent math. */
  .layer canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .layer .art { position: absolute; inset: 0; background: #08064F; }
  .caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 2.5vh 4vw; color: #fff; font-size: 3.2vh;
    background: linear-gradient(transparent, rgba(0,0,0,.75)); text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  .caption:empty { display: none; }
  .empty { position: fixed; inset: 0; display: grid; place-items: center; color: #9aa3b2; text-align: center; padding: 6vw; }
  .empty[hidden] { display: none; }
  .empty h1 { font-weight: 600; font-size: 5vh; margin: 0 0 2vh; color: #e8ecf3; }
  .empty p { font-size: 2.6vh; margin: 0; line-height: 1.5; }
  .empty code { color: #fff; }
  .badge { position: fixed; top: 2vh; right: 2vw; color: #fff; background: rgba(0,0,0,.6); padding: .6vh 1.2vw; border-radius: 1vh;
    font-size: 2vh; opacity: 0; transition: opacity .3s; }
  .badge.show { opacity: 1; }
  .tap { position: fixed; inset: 0; display: none; place-items: center; background: rgba(0,0,0,.85); color: #fff; font-size: 4vh; text-align: center; padding: 4vw; }
  .tap.show { display: grid; }
</style>
</head>
<body>
<div class="stage">
  <div class="layer" id="a"></div>
  <div class="layer" id="b"></div>
</div>
<div class="empty" id="empty" hidden>
  <div>
    <h1>Qlass Display</h1>
    <p>No media yet. Upload photos or videos at <code id="adminUrl"></code>.<br>This screen updates automatically.</p>
  </div>
</div>
<div class="badge" id="badge"></div>
<div class="tap" id="tap"><div>Press OK / tap anywhere to start playback</div></div>

<script>
(() => {
  window.__qlassAlive && window.__qlassAlive(); // proves this script actually started parsing/running — see the dead-man's switch above
  const layers = [document.getElementById("a"), document.getElementById("b")];
  const emptyEl = document.getElementById("empty");
  const badge = document.getElementById("badge");
  const tap = document.getElementById("tap");
  document.getElementById("adminUrl").textContent = location.origin + "/admin";

  let playlist = { version: null, settings: {}, items: [] };
  let order = [];       // indices into playlist.items, respecting shuffle
  let pos = -1;         // position within order
  let active = 0;       // which layer is on screen
  let timer = null;
  let pendingUpdate = null;
  let userGestureNeeded = false;
  let lastShownAt = Date.now(); // updated every time a slide actually becomes visible; see watchdog below
  // When the current slide should have handed over by itself. Set from the item's real length, because
  // a 160s video is not a stall — a fixed threshold reloaded mid-playback and the deck never advanced.
  let stallDeadline = Date.now() + 180000;

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // Reception-area audio, in two independent layers.
  //  - volume is a hard ceiling set on the element itself; works on every browser, can't fail.
  //  - the compressor pulls loud peaks down so one shouty reel doesn't startle the room, since
  //    Instagram clips arrive mastered at wildly different levels.
  // The compressor is gated on sound having already played unmuted once. Routing an element through
  // an AudioContext *replaces* its own output, so wiring that up while the context is still suspended
  // (autoplay not yet permitted) would silence the whole deck rather than merely skip the effect.
  let audioCtx = null;
  let soundConfirmed = false;
  const compressed = typeof WeakSet === "function" ? new WeakSet() : null;

  const volumeFraction = (settings) => {
    const v = Number(settings.volume);
    return Math.min(Math.max(Number.isFinite(v) ? v / 100 : 0.6, 0), 1);
  };

  function attachCompressor(el, settings) {
    if (!settings.audioCompressor || !settings.videoSound || !soundConfirmed) return;
    if (compressed && compressed.has(el)) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    try {
      if (!audioCtx) {
        audioCtx = new Ctx();
        if (audioCtx.state === "suspended" && audioCtx.resume) audioCtx.resume();
      }
      if (audioCtx.state !== "running") return;
      const src = audioCtx.createMediaElementSource(el);
      const comp = audioCtx.createDynamicsCompressor();
      comp.threshold.value = -28; // start taming well below peak so typical speech/music is caught
      comp.knee.value = 30;
      comp.ratio.value = 12;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;
      src.connect(comp);
      comp.connect(audioCtx.destination);
      if (compressed) compressed.add(el);
      window.__qlassLog && window.__qlassLog("ok", "audio compressor attached");
    } catch (e) {
      window.__qlassLog && window.__qlassLog("warn", "audio compressor unavailable", (e && e.message) || "");
    }
  }

  function shuffled(n) {
    const a = [...Array(n).keys()];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  function rebuildOrder() {
    const n = playlist.items.length;
    order = playlist.settings.shuffle ? shuffled(n) : [...Array(n).keys()];
  }

  let fetchWasFailing = false;
  async function fetchPlaylist() {
    try {
      const r = await fetch("/api/playlist", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const data = await r.json();
      if (fetchWasFailing) { fetchWasFailing = false; window.__qlassLog && window.__qlassLog("ok", "Playlist fetch recovered"); }
      return data;
    } catch (e) {
      console.warn("playlist fetch failed", e);
      // Logged every time (not just once) now that it's a scrollable history instead of a single
      // overwritten line — seeing how often/when this recurs is itself useful debugging signal.
      fetchWasFailing = true;
      window.__qlassLog && window.__qlassLog("error", "Playlist fetch failed", e && e.message);
      return null;
    }
  }

  function applyUpdate(p) {
    const wasEmpty = playlist.items.length === 0;
    playlist = p;
    rebuildOrder();
    if (wasEmpty || pos >= order.length) pos = -1;
    emptyEl.hidden = p.items.length > 0;
    flash(p.items.length ? `Updated · ${p.items.length} item${p.items.length === 1 ? "" : "s"}` : "");
    window.__qlassLog && window.__qlassLog("ok", "Playlist applied", `${p.items.length} items, version ${p.version}`);
  }

  function flash(text) {
    if (!text) return;
    badge.textContent = text;
    badge.classList.add("show");
    setTimeout(() => badge.classList.remove("show"), 2500);
  }

  // Poll for changes; apply at the next item boundary so playback isn't cut mid-video.
  async function pollLoop() {
    for (;;) {
      await sleep((playlist.settings.refreshInterval || 30) * 1000);
      const p = await fetchPlaylist();
      if (p && p.version !== playlist.version) pendingUpdate = p;
    }
  }

  // Achiever slides are drawn on a canvas by achiever-art.js (same artwork as the Social Studio).
  let artLogo = null, artBg;
  const photoCache = new Map();
  const loadPhoto = (url) => { if (!url) return Promise.resolve(null); if (!photoCache.has(url)) photoCache.set(url, QlassArt.loadImage(url)); return photoCache.get(url); };
  function buildArt(item) {
    const wrap = document.createElement("div");
    wrap.className = "art";
    const cv = document.createElement("canvas");
    cv.width = 1920; cv.height = 1080;
    wrap.appendChild(cv);
    const ctx = cv.getContext("2d");
    const people = item.type === "recap" ? item.students : [item.student];
    let raf = 0, t0 = 0;
    const opts = { logo: null, contact: playlist.settings.contact || "", minPct: item.minPercent };
    const paint = (t) => {
      ctx.clearRect(0, 0, 1920, 1080);
      if (item.type === "recap") QlassArt.drawRecap(ctx, "landscape", people, { ...opts, t });
      else QlassArt.drawStudent(ctx, "landscape", people[0], { ...opts, t });
    };
    cv._ready = (async () => {
      try {
        await QlassArt.ready();
        if (!artLogo) artLogo = await QlassArt.loadImage("/assets/qlass-logo-white.png");
        if (artBg === undefined) artBg = await QlassArt.loadImage("/assets/photos/classroom.jpg");
        opts.logo = artLogo; opts.bgPhoto = artBg;
        await Promise.race([
          Promise.all(people.map(async (p) => { p.photo = await loadPhoto(p.photoUrl); })),
          sleep(4000),
        ]);
        paint(0);
        window.__qlassLog && window.__qlassLog("ok", `Canvas painted (${item.type})`);
        return true;
      } catch (err) {
        // Not re-thrown: waitReady's timeout already covers "never resolves", and a paint exception
        // here would otherwise surface as a vague, hard-to-place unhandled rejection instead of this.
        window.__qlassLog && window.__qlassLog("error", `Canvas paint failed (${item.type})`, (err && err.message) || String(err));
        return false;
      }
    })();
    cv._start = () => {
      t0 = performance.now();
      const loop = () => { const t = (performance.now() - t0) / 1000; paint(t); if (t < 6 && cv.isConnected) raf = requestAnimationFrame(loop); };
      loop();
    };
    cv._stop = () => cancelAnimationFrame(raf);
    return { wrap, el: cv };
  }

  function buildElement(item, settings) {
    if (item.type === "achiever" || item.type === "recap") return buildArt(item);
    const wrap = document.createElement("div");
    wrap.style.cssText = "position:absolute;inset:0";
    let el;
    if (item.type === "video") {
      el = document.createElement("video");
      el.src = item.url;
      el.muted = !settings.videoSound;
      el.autoplay = false;
      el.playsInline = true;
      el.preload = "auto";
      el.setAttribute("playsinline", "");
      el.volume = volumeFraction(settings);
      attachCompressor(el, settings);
    } else {
      el = document.createElement("img");
      el.src = item.url;
      el.alt = "";
      el.decoding = "async";
    }
    const cap = document.createElement("div");
    cap.className = "caption";
    cap.textContent = item.caption || "";
    wrap.append(el, cap);
    return { wrap, el };
  }

  // Human-readable MediaError.code for video/audio — e.g. 3 (DECODE) vs 4 (SRC_NOT_SUPPORTED) point
  // at very different root causes, so worth distinguishing on screen rather than just "error".
  const MEDIA_ERROR_NAMES = { 1: "ABORTED", 2: "NETWORK", 3: "DECODE", 4: "SRC_NOT_SUPPORTED" };
  function describeMediaError(el) {
    const err = el.error;
    if (!err) return "no MediaError set";
    return (MEDIA_ERROR_NAMES[err.code] || `code ${err.code}`) + (err.message ? `: ${err.message}` : "");
  }

  function waitReady(el, timeoutMs) {
    return new Promise((resolve) => {
      let done = false;
      const finish = (ok, reason) => {
        if (done) return;
        done = true;
        if (ok) window.__qlassLog && window.__qlassLog("ok", `${el.tagName} ready`, reason);
        else window.__qlassLog && window.__qlassLog("error", `${el.tagName} not ready`, reason);
        resolve(ok);
      };
      const t = setTimeout(() => finish(false, `timed out after ${timeoutMs}ms`), timeoutMs);
      if (el.tagName === "CANVAS") { el._ready.then((ok) => { clearTimeout(t); finish(ok, ok ? "canvas painted" : "canvas paint failed"); }, (err) => { clearTimeout(t); finish(false, (err && err.message) || String(err)); }); return; }
      if (el.tagName === "IMG") {
        if (el.complete && el.naturalWidth) { clearTimeout(t); return finish(true, el.src); }
        el.onload = () => { clearTimeout(t); finish(true, el.src); };
        el.onerror = () => { clearTimeout(t); finish(false, `image load error: ${el.src}`); };
      } else {
        if (el.readyState >= 3) { clearTimeout(t); return finish(true, `readyState=${el.readyState} already`); }
        el.oncanplay = () => { clearTimeout(t); finish(true, `canplay, readyState=${el.readyState}`); };
        el.onerror = () => { clearTimeout(t); finish(false, describeMediaError(el)); };
      }
    });
  }

  async function showNext() {
    clearTimeout(timer);
    if (pendingUpdate) { applyUpdate(pendingUpdate); pendingUpdate = null; }
    if (!order.length) {
      layers.forEach((l) => { l.classList.remove("show"); l.innerHTML = ""; });
      timer = setTimeout(showNext, 5000);
      return;
    }
    const prevPos = pos;
    pos = (pos + 1) % order.length;
    if (pos === 0 && playlist.settings.shuffle) rebuildOrder();
    const item = playlist.items[order[pos]];
    // Logs every advance's bookkeeping explicitly — if pos ever stops incrementing normally, or
    // order.length changes between calls (e.g. the playlist being rebuilt mid-rotation), it'll be
    // directly visible here instead of inferred from which slide appears on screen.
    const tag = `pos ${prevPos}->${pos} (order.length=${order.length}, items=${playlist.items.length})`;
    if (!item) {
      window.__qlassLog && window.__qlassLog("error", `No item at this position`, tag);
      timer = setTimeout(showNext, 500);
      return;
    }

    window.__qlassLog && window.__qlassLog("info", `#${pos + 1}/${order.length} type=${item.type} building`, tag);
    const next = layers[1 - active];
    const cur = layers[active];
    const { wrap, el } = buildElement(item, playlist.settings);
    next.innerHTML = "";
    next.appendChild(wrap);
    // Force no-fade for video: on some TV browsers, hardware video decode renders to a separate
    // overlay surface that doesn't composite correctly under a CSS opacity transition — the audio
    // plays fine but the frame itself never becomes visible. Fading images/canvas slides is safe;
    // video always cuts instantly regardless of the configured transition setting.
    const instant = playlist.settings.transition === "none" || item.type === "video";
    layers.forEach((l) => l.classList.toggle("instant", instant));

    const ok = await waitReady(el, item.type === "video" ? 20000 : 15000); // waitReady itself logs ok/error with the specific reason
    if (!ok) {
      console.warn("skipping unplayable item", item.url);
      window.__qlassLog && window.__qlassLog("error", `#${pos + 1}/${order.length} skipped (not ready)`, item.url);
      next.innerHTML = "";
      timer = setTimeout(showNext, 300);
      return;
    }

    if (item.type === "video") {
      window.__qlassLog && window.__qlassLog("info", `#${pos + 1}/${order.length} ready, calling play()`);
      // el.play() has no built-in timeout — on some TV WebViews its Promise never settles at all
      // (neither resolves nor rejects), which used to freeze the entire display on this single
      // await forever (nothing else runs after it until it does). Race it against a timer so a
      // stuck play() is treated as a playback failure instead of hanging the whole loop.
      const playOrTimeout = () => Promise.race([
        el.play(),
        sleep(6000).then(() => { throw new Error("play() timed out"); }),
      ]);
      try {
        await playOrTimeout();
        // Proof that this browser permits audio, which is what makes it safe to route later videos
        // through an AudioContext for the compressor. See attachCompressor above.
        if (!el.muted) soundConfirmed = true;
        window.__qlassLog && window.__qlassLog("ok", `#${pos + 1}/${order.length} play() succeeded`, `muted=${el.muted} vol=${el.volume}`);
      } catch (err) {
        window.__qlassLog && window.__qlassLog("warn", `#${pos + 1}/${order.length} play() failed unmuted`, (err && err.message) || String(err));
        // Autoplay with sound is blocked until a user gesture; fall back to muted.
        if (!el.muted) {
          el.muted = true;
          try {
            await playOrTimeout();
            window.__qlassLog && window.__qlassLog("ok", `#${pos + 1}/${order.length} play() succeeded muted (fallback)`);
          } catch (err2) {
            window.__qlassLog && window.__qlassLog("error", `#${pos + 1}/${order.length} play() failed even muted`, (err2 && err2.message) || String(err2));
          }
        }
        if (el.paused) {
          // This is unattended signage — nobody will tap a TV, so don't block forever waiting
          // for a gesture. Skip this one item and move on; keep tap-to-resume as a bonus for the
          // (rare) case someone actually does interact with the screen.
          console.warn("video could not autoplay even muted; skipping", item.url);
          window.__qlassLog && window.__qlassLog("error", `#${pos + 1}/${order.length} still paused, skipping`, describeMediaError(el));
          next.innerHTML = "";
          timer = setTimeout(showNext, 300);
          return;
        }
      }
    }

    if (el._start) el._start();
    next.classList.add("show");
    cur.classList.remove("show");
    active = 1 - active;
    lastShownAt = Date.now(); // watchdog below reloads the page if this stops advancing
    window.__qlassAlive && window.__qlassAlive(); // also defers the independent dead-man's switch above
    window.__qlassLog && window.__qlassLog("ok", `#${pos + 1}/${order.length} type=${item.type} SHOWING`, el.tagName === "VIDEO" ? `muted=${el.muted}` : "");
    // Free the previous layer's media after the fade so the TV doesn't keep decoding it.
    setTimeout(() => { const c = cur.querySelector("canvas"); if (c && c._stop) c._stop(); const v = cur.querySelector("video"); if (v) { v.pause(); v.removeAttribute("src"); v.load(); } cur.innerHTML = ""; }, instant ? 0 : 900);

    if (item.type === "video") {
      const dur = Number(item.duration);
      el.onended = () => { window.__qlassLog && window.__qlassLog("ok", `#${pos + 1}/${order.length} video ended normally`); showNext(); };
      el.onerror = () => { window.__qlassLog && window.__qlassLog("error", `#${pos + 1}/${order.length} video error during playback`, describeMediaError(el)); showNext(); };
      // Safety net: if 'ended' never fires (stalled stream), move on after the known length + grace.
      // The "duration unknown" fallback used to be 600s — fine for a legitimate long video still
      // resolving its metadata, but on a device where video is actually broken (confirmed: this exact
      // gap is what the 2-min watchdog has been rescuing from) it meant up to 10 minutes stuck on one
      // black, frozen slide every single cycle. These are short reels; 45s is already generous.
      const fallbackMs = ((Number.isFinite(el.duration) && el.duration > 0 ? el.duration : 45) + 15) * 1000;
      const advanceMs = dur > 0 ? dur * 1000 : fallbackMs;
      stallDeadline = Date.now() + advanceMs + 60000;
      timer = setTimeout(() => { window.__qlassLog && window.__qlassLog("warn", `#${pos + 1}/${order.length} video 'ended' never fired, advancing via fallback timer`); showNext(); }, advanceMs);
    } else {
      const secs = Number(item.duration) > 0 ? Number(item.duration) : (playlist.settings.imageDuration || 10);
      stallDeadline = Date.now() + secs * 1000 + 60000;
      timer = setTimeout(showNext, secs * 1000);
    }
  }

  // Resume after a required user gesture (some TV browsers).
  const resume = () => {
    if (!userGestureNeeded) return;
    userGestureNeeded = false;
    tap.classList.remove("show");
    pos -= 1; // replay the item that was blocked
    showNext();
  };
  ["click", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, resume));

  // A blocked-with-sound video falls back to muted and plays on, so resume() above never fires and
  // nothing would ever unmute it — the deck runs silent for the rest of that slide. A gesture is also
  // what grants the autoplay permission, so later videos get their sound back on their own retry.
  const unmuteCurrent = () => {
    const v = document.querySelector(".layer.show video");
    if (!v || !v.muted || !playlist.settings.videoSound) return;
    v.muted = false;
    v.volume = volumeFraction(playlist.settings);
    const p = v.play();
    if (p && p.catch) p.catch(() => { v.muted = true; });
    soundConfirmed = true;
    window.__qlassLog && window.__qlassLog("ok", "audio unlocked by user gesture", `vol=${v.volume}`);
  };
  ["click", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, unmuteCurrent));

  // Request fullscreen so the TV browser's own address bar hides itself — most browsers (including
  // TV ones) only allow this from a user gesture, so try once on load (works on some TV browsers
  // that treat remote "OK" / page focus as a gesture) and again on the first real click/key/touch.
  function tryFullscreen() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req && !document.fullscreenElement) {
      try {
        const result = req.call(el);
        // Modern browsers return a Promise that rejects without a user gesture (expected on first
        // auto-attempt); older ones return undefined synchronously. Swallow both failure shapes —
        // this is best-effort, and the gesture-triggered retry below is the real fallback.
        if (result && typeof result.catch === "function") result.catch(() => {});
      } catch { /* blocked until a user gesture; the listener below retries */ }
    }
  }
  tryFullscreen();
  ["click", "keydown", "touchstart"].forEach((ev) => document.addEventListener(ev, tryFullscreen, { once: true }));

  // Keep the screen awake where supported.
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator) {
        let lock = await navigator.wakeLock.request("screen");
        document.addEventListener("visibilitychange", async () => {
          if (document.visibilityState === "visible") lock = await navigator.wakeLock.request("screen").catch(() => null);
        });
      }
    } catch { /* not supported */ }
  }

  // Reload the whole page once a day to shake off memory leaks in TV browsers.
  setTimeout(() => location.reload(), 24 * 3600 * 1000);

  // Self-healing watchdog: this is unattended signage, so nobody is around to notice a stuck slide
  // and press reload. If a slide should have advanced by now but hasn't (any hang, anywhere in the
  // pipeline — a stuck video, a canvas draw error, whatever), force a full reload instead of staying
  // dark indefinitely. Skipped while the playlist is genuinely empty (that's a real, valid state, not
  // a stall) — only applies once there's content that should be rotating.
  setInterval(() => {
    // Proves the JS loop itself is still alive even when there's legitimately nothing to show (an
    // empty playlist) — only the slide-stall check below needs actual content to judge against.
    window.__qlassAlive && window.__qlassAlive();
    if (playlist.items.length > 0 && Date.now() > stallDeadline) {
      const stuckFor = Math.round((Date.now() - lastShownAt) / 1000);
      window.__qlassDiagReport && window.__qlassDiagReport("Watchdog: slide overran its own length by 60s+ (" + stuckFor + "s on screen), reloading");
      location.reload();
    }
  }, 20000);

  (async () => {
    window.__qlassStatus && window.__qlassStatus("booting, fetching playlist...");
    keepAwake();
    let p = await fetchPlaylist();
    while (!p) { await sleep(5000); p = await fetchPlaylist(); }
    applyUpdate(p);
    window.__qlassStatus && window.__qlassStatus("playlist loaded (" + p.items.length + " items), starting rotation");
    badge.classList.remove("show");
    pollLoop();
    showNext();
  })();
})();
</script>
</body>
</html>
