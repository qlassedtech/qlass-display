<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qlass Display · Social studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root { --bg:#F4F5FB; --line:#E1E3F0; --text:#0D0B6E; --accent:#0D0B6E; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Manrope',system-ui,sans-serif; font-size:15px; }
  a { color:var(--accent); }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 24px; border-bottom:1px solid var(--line); gap:12px; flex-wrap:wrap; background:#fff; flex:none; }
  header .brand { display:flex; align-items:center; gap:14px; }
  header .brand img { height:28px; display:block; }
  header .brand i { width:1px; height:22px; background:var(--line); }
  header h1 { font-size:16px; margin:0; font-weight:700; }
  header .links { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 13px; font-size:13px; cursor:pointer; text-decoration:none; display:inline-block; white-space:nowrap; font-weight:600; }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn.on { background:#EEF0FF; border:1px solid var(--line); color:var(--text); cursor:default; }
  iframe { flex:1; width:100%; border:0; display:block; background:#fff; }
</style>
</head>
<body>
  <header>
    <div class="brand"><img src="/assets/qlass-logo.png" alt="Qlass Learning"><i></i><h1>Social studio</h1></div>
    <div class="links">
      <a class="btn on">Social studio</a>
      <a class="btn ghost" href="/admin">Display portal</a>
      <a class="btn ghost" href="/" target="_blank">Open TV player ↗</a>
    </div>
  </header>
  <iframe src="/studio/app" title="Social studio" allow="clipboard-write"></iframe>
</body>
</html>
